name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow babel tkcalendar

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all customtkinter --add-data "2.jpeg;." --add-data "3.jpeg;." --add-data "images.jpeg;." --add-data "logo.jpeg;." --add-data "pos_database_v2.db;." main.py

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: Supermarket-POS-Windows
          path: dist/*.exe
